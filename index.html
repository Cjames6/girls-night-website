<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Ultimate Girls’ Night In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">YOUR COZY NIGHT STARTS HERE</p>
      <h1>The Ultimate Girls’ Night In</h1>
      <p>Three simple ideas for making memories with your favorite people.</p>
      <a class="button" href="#ideas">Explore the ideas</a>
    </div>
    <p class="hero-credit">Photo: <a href="https://unsplash.com/photos/zdSoe8za6Hs">Levi Guzman / Unsplash</a></p>
  </header>
  <main id="ideas" class="ideas">
    <h2>Pick Your Perfect Night</h2>
    <p class="intro">A little inspiration for your next get-together.</p>
    <div class="cards">
      <figure class="card">
        <div class="photo-wrap"><img src="movie-night.jpg" alt="Person watching TV with popcorn and a remote"></div>
        <figcaption>
          <h3>Movie Marathon</h3>
          <p>Pick a favorite movie, grab blankets, and pass the popcorn.</p>
          <small>Photo: <a href="https://unsplash.com/photos/PpYOQgsZDM4">JESHOOTS.COM / Unsplash</a></small>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="photo-wrap"><img src="sweet-treats.jpg" alt="Colorful snacks, cake, and fruit arranged on a table"></div>
        <figcaption>
          <h3>Sweet Treats</h3>
          <p>Make a dessert board and let everyone bring a favorite snack.</p>
          <small>Photo: <a href="https://unsplash.com/photos/lwoL2QbCK_c">Selina Farzaei / Unsplash</a></small>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="photo-wrap"><img src="catch-up.jpg" alt="Three friends relaxing together on a bed"></div>
        <figcaption>
          <h3>Catch-Up &amp; Chill</h3>
          <p>Put your phones down, share stories, and enjoy good company.</p>
          <small>Photo: <a href="https://unsplash.com/photos/oA1-rirIJ2E">Katarzyna Grabowska / Unsplash</a></small>
        </figcaption>
      </figure>
    </div>
  </main>
  <footer>Made with ♡ for a cozy night in.</footer>
</body>
</html>
